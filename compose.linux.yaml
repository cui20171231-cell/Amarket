name: amarket-linux

services:
  clickhouse:
    container_name: amarket-clickhouse
    image: clickhouse/clickhouse-server:26.3
    restart: unless-stopped
    env_file:
      - ./secrets/collector.env
    environment:
      CLICKHOUSE_USER: hithink_snapshot
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/lib/amarket/clickhouse:/var/lib/clickhouse
      - ./infra/clickhouse/config.d/log_retention.xml:/etc/clickhouse-server/config.d/log_retention.xml:ro
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
